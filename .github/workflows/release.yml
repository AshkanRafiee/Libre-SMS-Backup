name: Release Android APK and AAB

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version_name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$version_name"
          test "$TAG_NAME" = "v$version_name"
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LIBRESMSBACKUP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIBRESMSBACKUP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIBRESMSBACKUP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIBRESMSBACKUP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=(LIBRESMSBACKUP_KEYSTORE_BASE64)
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=(LIBRESMSBACKUP_KEYSTORE_PASSWORD)
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=(LIBRESMSBACKUP_KEY_ALIAS)
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=(LIBRESMSBACKUP_KEY_PASSWORD)
          if ((${#missing[@]} > 0)); then
            echo "::error title=Missing release signing secrets::Add the missing names in Settings > Environments > release."
            printf 'Missing: %s\n' "${missing[*]}"
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode >/dev/null 2>&1; then
            echo "::error title=Invalid keystore secret::LIBRESMSBACKUP_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
      - name: Restore production signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.LIBRESMSBACKUP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LIBRESMSBACKUP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIBRESMSBACKUP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIBRESMSBACKUP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/libresmsbackup-release.p12
          python3 - <<'PY'
          import os

          def escape(value):
              result = []
              for index, character in enumerate(value):
                  code = ord(character)
                  if code > 0xFFFF:
                      code -= 0x10000
                      result.append(f"\\u{0xD800 + (code >> 10):04x}")
                      result.append(f"\\u{0xDC00 + (code & 0x3FF):04x}")
                  elif character == '\\':
                      result.append('\\\\')
                  elif character == '\n':
                      result.append('\\n')
                  elif character == '\r':
                      result.append('\\r')
                  elif character == '\t':
                      result.append('\\t')
                  elif character == '\f':
                      result.append('\\f')
                  elif character in '=:#!' or (character == ' ' and index == 0):
                      result.append('\\' + character)
                  elif code < 0x20 or code > 0x7E:
                      result.append(f"\\u{code:04x}")
                  else:
                      result.append(character)
              return ''.join(result)

          values = {
              'storeFile': 'app/libresmsbackup-release.p12',
              'storeType': 'PKCS12',
              'storePassword': os.environ['KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          with open('signing.properties', 'w', encoding='ascii', newline='\n') as properties:
              for key, value in values.items():
                  properties.write(f'{key}={escape(value)}\n')
          PY
          keytool -list -keystore app/libresmsbackup-release.p12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Build signed release artifacts
        run: bash ./gradlew clean assembleRelease bundleRelease
      - name: Verify APK signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify
          --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Create checksums
        run: |
          set -euo pipefail
          apk_name="Libre-SMS-Backup-${TAG_NAME}.apk"
          aab_name="Libre-SMS-Backup-${TAG_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          cp app/build/outputs/bundle/release/app-release.aab "$aab_name"
          sha256sum "$apk_name" "$aab_name" > "Libre-SMS-Backup-${TAG_NAME}-SHA256SUMS"
      - name: Stage release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            Libre-SMS-Backup-${{ env.TAG_NAME }}.apk
            Libre-SMS-Backup-${{ env.TAG_NAME }}.aab
            Libre-SMS-Backup-${{ env.TAG_NAME }}-SHA256SUMS
          if-no-files-found: error
          overwrite: true
      - name: Remove signing material
        if: always()
        run: rm -f signing.properties app/libresmsbackup-release.p12

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "release-assets/Libre-SMS-Backup-${TAG_NAME}.apk" \
            "release-assets/Libre-SMS-Backup-${TAG_NAME}.aab" \
            "release-assets/Libre-SMS-Backup-${TAG_NAME}-SHA256SUMS"
