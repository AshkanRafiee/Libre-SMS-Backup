plugins { id 'com.android.application' }

android {
    namespace = 'com.ashkanrafiee.libresmsbackup'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.ashkanrafiee.libresmsbackup'
        minSdk 26
        targetSdk 36
        // versionCode = major * 10000 + minor * 1000 + patch
        versionCode 10002
        versionName '1.0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds true; abortOnError true }

    dependenciesInfo { includeInApk = false; includeInBundle = false }

    def signingFile = rootProject.file('signing.properties')
    def signingValues = new Properties()
    if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
    signingConfigs {
        release {
            if (signingValues['storeFile']) {
                storeFile rootProject.file(signingValues['storeFile'])
                if (signingValues['storeType']) storeType signingValues['storeType']
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            if (signingValues['storeFile']) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            vcsInfo { include = false }
        }
    }

    testOptions { managedDevices { localDevices { "pixel_6" { apiLevel = 36 } } } }

    bundle { language { enableSplit = false } }
}

dependencies {
    // Test-only infrastructure; the shipped application has no third-party runtime dependencies.
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
